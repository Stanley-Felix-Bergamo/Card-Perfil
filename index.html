<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Cards de Perfil</title>
</head>

<body>
    <h2>Cards de Perfil</h2>
    <div class="container">
        <div class="perfil">
            <img src="https://images.unsplash.com/photo-1777827839146-d634aee2c991?q=80&w=200&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                alt="Avatar" class="perfil__avatar">
            <h3 class="perfil__nome">José Agusto</h3>
            <p class="perfil__bio">Programador Front-end: React,HTML,CSS</p>
            <button class="perfil__botao">Seguir</button>
        </div>
        <div class="perfil perfil--vip">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                alt="Imagem" class="perfil__avatar">
            <h3 class="perfil__nome">Arnaldo Texeira</h3>
            <p class="perfil__bio">Programador Back-end: Python,C#,MySQL</p>
            <button class="perfil__botao">Perfil vip</button>
        </div>
    </div>
</body>

</html>
